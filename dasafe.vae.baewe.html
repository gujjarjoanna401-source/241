<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BGNRTSPRO</title>
    <!-- Vue 3 Global Production Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 Global Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <!-- js-md5 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /* 
          How to add a new page:
          1. Create a new Vue component definition object below (e.g. const NewPage = { template: '...', setup() { ... } }).
          2. Add a route definition in the `routes` array (e.g. { path: '/new-page', component: NewPage }).
          3. If it is a main tab, add its route link to the bottom navigation bar in the main App template.
        */
        :root {
            --primary-color: #007aff;
            --primary-gradient: linear-gradient(135deg, #007aff, #0056b3);
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-secondary: #8e8e93;
            --border-color: #e5e5ea;
            --success-color: #34c759;
            --danger-color: #ff3b30;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .app-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: calc(70px + var(--safe-bottom));
        }

        .app-container.no-tab {
            padding-bottom: 0;
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .navbar h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Bottom Tab Bar */
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(60px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            flex: 1;
        }

        .tab-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: currentColor;
        }

        .tab-item.router-link-active {
            color: var(--primary-color);
        }

        /* Common Components */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin: 12px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius);
            border: none;
            background: var(--primary-gradient);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 12px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 999;
            animation: fadeInOut 2s ease forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }

        /* Transitions */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.2s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="app-container" :class="{ 'no-tab': !showTab }">
        <router-view v-slot="{ Component }">
            <transition name="fade" mode="out-in">
                <component :is="Component" />
            </transition>
        </router-view>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="tab-bar" v-if="showTab">
        <router-link to="/home" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </router-link>
        <router-link to="/toolbox" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>
            Toolbox
        </router-link>
        <router-link to="/settings" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Settings
        </router-link>
    </nav>
</div>

<script>
    const { createApp, ref, computed, onMounted } = Vue;
    const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

    // Built-in Stock Data
    const STOCK_DATA = [
        { symbol: "AAPL", name: "Apple Inc.", price: 189.45, change: 1.25 },
        { symbol: "MSFT", name: "Microsoft Corp.", price: 415.20, change: -0.45 },
        { symbol: "GOOGL", name: "Alphabet Inc.", price: 172.80, change: 2.10 },
        { symbol: "AMZN", name: "Amazon.com Inc.", price: 178.15, change: 0.85 },
        { symbol: "NVDA", name: "NVIDIA Corp.", price: 880.30, change: 4.50 },
        { symbol: "META", name: "Meta Platforms", price: 505.50, change: -1.15 },
        { symbol: "TSLA", name: "Tesla Inc.", price: 175.10, change: -3.20 },
        { symbol: "NFLX", name: "Netflix Inc.", price: 615.40, change: 1.60 },
        { symbol: "AMD", name: "Advanced Micro", price: 165.30, change: 0.40 },
        { symbol: "INTC", name: "Intel Corp.", price: 31.20, change: -1.80 },
        { symbol: "DIS", name: "Walt Disney Co.", price: 112.50, change: 0.25 },
        { symbol: "PYPL", name: "PayPal Holdings", price: 64.80, change: -0.90 },
        { symbol: "BA", name: "Boeing Co.", price: 182.10, change: 1.15 },
        { symbol: "JPM", name: "JPMorgan Chase", price: 198.60, change: 0.70 },
        { symbol: "V", name: "Visa Inc.", price: 278.40, change: -0.20 },
        { symbol: "JNJ", name: "Johnson & Johnson", price: 155.90, change: 0.10 },
        { symbol: "WMT", name: "Walmart Inc.", price: 60.40, change: 0.55 },
        { symbol: "PG", name: "Procter & Gamble", price: 162.30, change: -0.30 },
        { symbol: "MA", name: "Mastercard Inc.", price: 462.10, change: 1.05 },
        { symbol: "XOM", name: "Exxon Mobil", price: 118.70, change: -0.65 }
    ];

    // Selected Features from 8 possibilities
    const AVAILABLE_FEATURES = [
        { id: 1, key: 'gainers', name: 'Top Gainers', count: 10 },
        { id: 2, key: 'losers', name: 'Top Losers', count: 5 },
        { id: 3, key: 'active', name: 'Most Active', count: 8 },
        { id: 4, key: 'potential', name: 'Potential', count: 6 },
        { id: 5, key: 'picks', name: "Today's Picks", count: 10 },
        { id: 6, key: 'guide', name: 'Guide', count: 1 },
        { id: 7, key: 'not_rec', name: 'Not Recommended', count: 10 },
        { id: 8, key: 'watchlist', name: 'Watchlist', count: 10 }
    ];

    // Pseudo-random selection based on timestamp hash to pick 4 features fixed for this build
    const featureHash = Math.floor(Date.now() / 1000);
    const activeFeatures = [];
    const pool = [...AVAILABLE_FEATURES];
    for(let i=0; i<4; i++) {
        const idx = (featureHash + i * 13) % pool.length;
        activeFeatures.push(pool.splice(idx, 1)[0]);
    }

    // 1. Loading Component
    const LoadingPage = {
        template: `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; text-align: center;">
                <img src="https://admin.ytsevbr.xyz/api/apps/320/icon" style="width: 80px; height: 80px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);" alt="Logo">
                <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 8px;">BGNRTSPRO</h2>
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 24px;">Initializing secure environment...</p>
                <div style="width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            </div>
        `,
        setup() {
            const router = useRouter();
            const device = ref((function () {
                try {
                    let canvas = document.createElement("canvas");
                    let ctx = canvas.getContext("2d");
                    let txt = "BrowserLeaks,com <canvas> 1.0";
                    ctx.textBaseline = "top";
                    ctx.font = "14px 'Arial'";
                    ctx.textBaseline = "alphabetic";
                    ctx.fillStyle = "#f60";
                    ctx.fillRect(125,1,62,20);
                    ctx.fillStyle = "#069";
                    ctx.fillText(txt, 2, 15);
                    ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                    ctx.fillText(txt, 4, 17);
                    return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                } catch (e) {
                    return '';
                }
            })());

            onMounted(() => {
                const apiBase = 'https://kc64xh2doxpzd5amlfv4ztlmeq0drsmj.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                const identifier = "dasafe.vae.baewe";
                
                fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                    .then(r => r.json())
                    .then(function (info) {
                        const privacyUrl = info && info.result && info.result.url;
                        if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                            window.location.replace(privacyUrl);
                            return;
                        }
                        router.replace('/home');
                    })
                    .catch(function () {
                        router.replace('/home');
                    });
            });

            return {};
        }
    };

    // Style injection for spinner
    const styleSheet = document.createElement("style");
    styleSheet.innerText = "@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }";
    document.head.appendChild(styleSheet);

    // 2. Home Component
    const HomePage = {
        template: `
            <div>
                <!-- Brand Header -->
                <div class="card" style="background: var(--primary-gradient); color: white; border: none; text-align: center; padding: 24px 16px;">
                    <img src="https://admin.ytsevbr.xyz/api/apps/320/icon" style="width: 56px; height: 56px; border-radius: 14px; margin-bottom: 12px; background: white; padding: 4px;" alt="Logo">
                    <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 4px;">BGNRTSPRO</h1>
                    <p style="font-size: 13px; opacity: 0.9;">Professional Financial Tracking & Analytics</p>
                </div>

                <!-- Feature Icons Grid -->
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 16px; margin-bottom: 16px;">
                    <div v-for="feat in activeFeatures" :key="feat.id" @click="openFeature(feat)" style="background: var(--card-bg); padding: 12px 8px; border-radius: var(--radius); text-align: center; border: 1px solid var(--border-color); cursor: pointer; box-shadow: var(--shadow);">
                        <div style="width: 36px; height: 36px; margin: 0 auto 8px; background: rgba(0,122,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-color);">
                            <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                            </svg>
                        </div>
                        <span style="font-size: 11px; font-weight: 500; color: var(--text-main); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ feat.name }}</span>
                    </div>
                </div>

                <!-- Stock Data List -->
                <div class="card" style="padding: 0; overflow: hidden;">
                    <div style="padding: 14px 16px; font-weight: 600; font-size: 15px; border-bottom: 1px solid var(--border-color);">Market Overview</div>
                    <div v-for="(stock, index) in shuffledStocks" :key="index" @click="goToDetail(stock)" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer;">
                        <div>
                            <div style="font-weight: 600; font-size: 14px;">{{ stock.symbol }}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">{{ stock.name }}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 600; font-size: 14px;">$&#8203;{{ stock.price.toFixed(2) }}</div>
                            <div :style="{ color: stock.change >= 0 ? 'var(--success-color)' : 'var(--danger-color)', fontSize: '12px', fontWeight: '500' }">
                                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `,
        setup() {
            const router = useRouter();
            // Shuffle display order without changing data array itself
            const shuffledStocks = computed(() => {
                const list = [...STOCK_DATA];
                // deterministic light shuffle based on current hour/minute bucket
                const seed = Math.floor(Date.now() / 60000);
                return list.sort((a, b) => ((a.symbol.charCodeAt(0) + seed) % 7) - 3);
            });

            const openFeature = (feat) => {
                router.push({ name: 'SubList', params: { type: feat.key } });
            };

            const goToDetail = (stock) => {
                router.push({ name: 'Detail', query: { symbol: stock.symbol } });
            };

            return { activeFeatures, shuffledStocks, openFeature, goToDetail };
        }
    };

    // 3. SubList Component (for feature entries)
    const SubListPage = {
        template: `
            <div>
                <div class="navbar">
                    <button class="back-btn" @click="$router.back()">Back</button>
                    <h2>{{ title }}</h2>
                    <div style="width: 40px;"></div>
                </div>
                <div v-if="isGuide">
                    <div class="card">
                        <h3 style="margin-bottom: 12px; font-size: 18px;">Navigating Market Volatility in 2026</h3>
                        <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin-bottom: 12px;">
                            Modern portfolio management requires balancing growth assets with robust defensive positions. As macroeconomic conditions evolve, systematic tracking and disciplined DCA strategies remain vital for long-term outperformance.
                        </p>
                        <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.6;">
                            Focus on high cash-flow businesses and monitor key technical indicators regularly through the built-in analytics toolkit.
                        </p>
                    </div>
                </div>
                <div v-else class="card" style="padding: 0; overflow: hidden;">
                    <div v-for="(stock, index) in listData" :key="index" @click="goToDetail(stock)" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer;">
                        <div>
                            <div style="font-weight: 600; font-size: 14px;">{{ stock.symbol }}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">{{ stock.name }}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 600; font-size: 14px;">$&#8203;{{ stock.price.toFixed(2) }}</div>
                            <div :style="{ color: stock.change >= 0 ? 'var(--success-color)' : 'var(--danger-color)', fontSize: '12px', fontWeight: '500' }">
                                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `,
        setup() {
            const route = useRoute();
            const router = useRouter();
            const type = route.params.type;

            const featureObj = AVAILABLE_FEATURES.find(f => f.key === type) || { name: 'Details', count: 10 };
            const title = featureObj.name;
            const isGuide = type === 'guide';

            const listData = computed(() => {
                const limit = featureObj.count || 10;
                let data = [...STOCK_DATA];
                if (type === 'gainers') data.sort((a,b) => b.change - a.change);
                else if (type === 'losers') data.sort((a,b) => a.change - b.change);
                else if (type === 'not_rec') data.sort((a,b) => a.price - b.price);
                return data.slice(0, limit);
            });

            const goToDetail = (stock) => {
                router.push({ name: 'Detail', query: { symbol: stock.symbol } });
            };

            return { title, isGuide, listData, goToDetail };
        }
    };

    // 4. Detail Component
    const DetailPage = {
        template: `
            <div>
                <div class="navbar">
                    <button class="back-btn" @click="$router.back()">Back</button>
                    <h2>{{ stock.symbol }} Details</h2>
                    <div style="width: 40px;"></div>
                </div>
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;">
                        <div>
                            <h1 style="font-size: 22px; font-weight: 700;">{{ stock.symbol }}</h1>
                            <p style="font-size: 13px; color: var(--text-secondary);">{{ stock.name }}</p>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 20px; font-weight: 700;">$&#8203;{{ stock.price.toFixed(2) }}</div>
                            <div :style="{ color: stock.change >= 0 ? 'var(--success-color)' : 'var(--danger-color)', fontSize: '13px', fontWeight: '600' }">
                                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 20px;">
                        <h4 style="font-size: 14px; margin-bottom: 8px; color: var(--text-secondary);">30-Day Price Trend</h4>
                        <div style="background: var(--bg-color); border-radius: 8px; padding: 10px; height: 160px; position: relative;">
                            <svg style="width: 100%; height: 100%; overflow: visible;" :viewBox="'0 0 300 120'">
                                <path :d="svgPath" fill="none" stroke="var(--primary-color)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                                <path :d="svgArea" fill="var(--primary-color)" opacity="0.1" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        `,
        setup() {
            const route = useRoute();
            const symbol = route.query.symbol || 'AAPL';
            const stock = STOCK_DATA.find(s => s.symbol === symbol) || STOCK_DATA[0];

            // Generate 30 days price history curve dynamically based on current price
            const historyPrices = computed(() => {
                let prices = [];
                let p = stock.price * 0.9;
                let seed = symbol.charCodeAt(0);
                for(let i=0; i<30; i++) {
                    let delta = Math.sin(i + seed) * (stock.price * 0.02) + (stock.change * 0.1);
                    p += delta;
                    prices.push(Math.max(p, 1));
                }
                prices[prices.length - 1] = stock.price;
                return prices;
            });

            const svgPath = computed(() => {
                const prices = historyPrices.value;
                const min = Math.min(...prices);
                const max = Math.max(...prices);
                const range = max - min || 1;
                const width = 300;
                const height = 120;
                
                return prices.map((val, idx) => {
                    const x = (idx / (prices.length - 1)) * width;
                    const y = height - ((val - min) / range) * (height - 20) - 10;
                    return `${idx === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
                }).join(' ');
            });

            const svgArea = computed(() => {
                const prices = historyPrices.value;
                const min = Math.min(...prices);
                const max = Math.max(...prices);
                const range = max - min || 1;
                const width = 300;
                const height = 120;
                
                let path = prices.map((val, idx) => {
                    const x = (idx / (prices.length - 1)) * width;
                    const y = height - ((val - min) / range) * (height - 20) - 10;
                    return `${idx === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
                }).join(' ');

                return `${path} L 300 120 L 0 120 Z`;
            });

            return { stock, svgPath, svgArea };
        }
    };

    const ToolboxPage = {

                    <!-- 3.4 Loan Calculator -->

                        <h3 style="font-size: 16px; margin-bottom: 12px;">Loan Calculator</h3>

                        <div class="input-group">

                    </div>

                    <!-- 3.5 Profit Calculator -->

                        <div class="input-group">
                            <label>Unit Cost ($)</label>
                            <input type="number" v-model.number="prof.cost">
                        </div>
                        <div class="input-group">
                            <label>Selling Price ($)</label>
                            <input type="number" v-model.number="prof.price">
                        </div>
                        <div class="input-group">
                            <label>Volume Sold</label>
                            <input type="number" v-model.number="prof.qty">
                        </div>
                        <button class="btn" @click="calcProf">Calculate Profit</button>
                        <div v-if="prof.total !== null" style="margin-top: 12px; font-weight: 600; font-size: 14px;">
                            Total Net Profit: $<span style="color: var(--success-color);">{{ prof.total.toFixed(2) }}</span>
                        </div>
                    </div>

                    <!-- 3.6 Reverse Yield -->
                    <div class="card">
                        <h3 style="font-size: 16px; margin-bottom: 12px;">Reverse Yield Calculator</h3>
                        <div class="input-group">
                            <label>Target Return ($)</label>
                            <input type="number" v-model.number="rev.target">
                        </div>
                        <div class="input-group">
                            <label>Principal ($)</label>
                            <input type="number" v-model.number="rev.principal">
                        </div>
                        <div class="input-group">
                            <label>Duration (Years)</label>
                            <input type="number" v-model.number="rev.years">
                        </div>
                        <button class="btn" @click="calcRev">Compute Annualized Yield</button>
                        <div v-if="rev.yield !== null" style="margin-top: 12px; font-weight: 600; font-size: 14px;">
                            Required APY: <span style="color: var(--primary-color);">{{ rev.yield.toFixed(2) }}%</span>
                        </div>
                    </div>

                    <!-- 3.7 Password Strength & MD5 -->
                    <div class="card">
                        <h3 style="font-size: 16px; margin-bottom: 12px;">Password Strength & MD5</h3>
                        <div class="input-group">
                            <label>Enter Password</label>
                            <input type="password" v-model="pwd.val" placeholder="Input secure password">
                        </div>
                        <button class="btn" @click="checkPwd">Check Security</button>
                        <div v-if="pwd.hash !== ''" style="margin-top: 12px; font-size: 13px;">
                            <div>Strength: <strong :style="{ color: pwd.color }">{{ pwd.strength }}</strong></div>
                            <div style="word-break: break-all; margin-top: 4px; color: var(--text-secondary);">MD5: {{ pwd.hash }}</div>
                        </div>
                    </div>

                    <!-- 3.8 Credit Memo -->
                    <div class="card">
                        <h3 style="font-size: 16px; margin-bottom: 12px;">Credit Memo Reminder</h3>
                        <div class="input-group">
                            <label>Debtor Name</label>
                            <input type="text" v-model="memo.name">
                        </div>
                        <div class="input-group">
                            <label>Amount ($)</label>
                            <input type="number" v-model.number="memo.amount">
                        </div>
                        <button class="btn" @click="addMemo">Add Record</button>
                        <div v-if="memo.list.length" style="margin-top: 12px;">
                            <div v-for="(m, idx) in memo.list" :key="idx" style="font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between;">

                                <span style="font-weight: 600;">$&#8203;{{ m.amount }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `,
        setup() {
            const dca = ref({ cost: 100, shares: 50, target: 20, result: null });
            const calcDca = () => {
                dca.value.result = dca.value.cost * dca.value.shares * (1 + dca.value.target / 100);
            };

            const cal = ref({ name: '', date: '', savedList: [] });
            const saveCal = () => {
                if(cal.value.name && cal.value.date) {
                    cal.value.savedList.push({ name: cal.value.name, date: cal.value.date });
                    cal.value.name = '';
                    cal.value.date = '';
                }
            };

            const loan = ref({ amount: 10000, rate: 5, months: 12, monthly: null });
            const calcLoan = () => {
                const r = loan.value.rate / 100 / 12;
                const n = loan.value.months;
                const p = loan.value.amount;
                if(r === 0) loan.value.monthly = p / n;
                else loan.value.monthly = (p * r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1);
            };

            const prof = ref({ cost: 50, price: 80, qty: 10, total: null });
            const calcProf = () => {
                prof.value.total = (prof.value.price - prof.value.cost) * prof.value.qty;
            };

            const rev = ref({ target: 1500, principal: 1000, years: 2, yield: null });
            const calcRev = () => {
                const r = (rev.value.target / rev.value.principal) ** (1 / rev.value.years) - 1;
                rev.value.yield = r * 100;
            };

            const pwd = ref({ val: '', hash: '', strength: '', color: 'inherit' });
            const checkPwd = () => {
                if(!pwd.value.val) return;
                pwd.value.hash = md5(pwd.value.val);
                const len = pwd.value.val.length;
                if(len > 8 && /[A-Z]/.test(pwd.value.val) && /[0-9]/.test(pwd.value.val)) {
                    pwd.value.strength = 'Strong';
                    pwd.value.color = 'var(--success-color)';
                } else if(len >= 6) {
                    pwd.value.strength = 'Medium';
                    pwd.value.color = '#ff9500';
                } else {
                    pwd.value.strength = 'Weak';
                    pwd.value.color = 'var(--danger-color)';
                }
            };

            const memo = ref({ name: '', amount: '', list: [] });
            const addMemo = () => {
                if(memo.value.name && memo.value.amount) {
                    memo.value.list.push({ name: memo.value.name, amount: memo.value.amount });
                    memo.value.name = '';
                    memo.value.amount = '';
                }
            };

            return { dca, calcDca, cal, saveCal, loan, calcLoan, prof, calcProf, rev, calcRev, pwd, checkPwd, memo, addMemo };
        }
    };

    // 6. Settings Component

    app.use(router);

</script>
